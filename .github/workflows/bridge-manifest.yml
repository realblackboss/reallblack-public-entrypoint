name: Publish Bridge Manifest

on:
  push:
    branches: [main]
    paths:
      - bridge/agent-v2.ps1
      - bridge/screen-helper.ps1
      - bridge/install-meshcentral-tailscale.ps1
      - bridge/harden-meshcentral.ps1
      - bridge/install-screen-helper.ps1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridge-manifest-main
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('bridge/agent-v2.ps1','bridge/install.ps1','bridge/screen-helper.ps1','bridge/install-screen-helper.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if (@($errors).Count -gt 0) {
              Write-Error ("Syntax errors in " + $file)
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Smoke-test GitHub content endpoints
        shell: pwsh
        run: |
          $headers = @{
            Accept = 'application/vnd.github.raw+json'
            'User-Agent' = 'REALLBLACK-Bridge-Validator'
          }
          $base = 'https://api.github.com/repos/realblackboss/reallblack-public-entrypoint/contents/'
          foreach ($path in @('bridge/manifest-v2.json','bridge/agent-v2.ps1','bridge/screen-helper.ps1','bridge/install-screen-helper.ps1')) {
            $uri = $base + $path + '?ref=main'
            $r = Invoke-WebRequest -UseBasicParsing -Method Get -Uri $uri -Headers $headers -TimeoutSec 20
            if ($r.StatusCode -ne 200 -or [string]::IsNullOrWhiteSpace([string]$r.Content)) {
              throw ('Endpoint validation failed: ' + $uri)
            }
          }

      - name: Generate manifest from validated agent
        shell: python
        run: |
          import hashlib, json, re
          from pathlib import Path
          p = Path('bridge/agent-v2.ps1')
          raw = p.read_bytes()
          text = raw.decode('utf-8')
          m = re.search(r"\$Version\s*=\s*'([^']+)'", text)
          if not m:
              raise SystemExit('Bridge version not found')
          manifest = {
              "version": m.group(1),
              "url": "https://raw.githubusercontent.com/realblackboss/reallblack-public-entrypoint/main/bridge/agent-v2.ps1",
              "sha256": hashlib.sha256(raw).hexdigest(),
              "protections": [
                  "sha256",
                  "syntax-parse",
                  "atomic-replace",
                  "health-check",
                  "last-good-backup",
                  "watchdog-rollback"
              ]
          }
          Path('bridge/manifest-v2.json').write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding='utf-8'
          )
          hp = Path('bridge/screen-helper.ps1')
          hraw = hp.read_bytes()
          htext = hraw.decode('utf-8')
          hm = re.search(r"\$Version\s*=\s*'([^']+)'", htext)
          if not hm:
              raise SystemExit('Screen helper version not found')
          hmanifest = {
              "version": hm.group(1),
              "url": "https://raw.githubusercontent.com/realblackboss/reallblack-public-entrypoint/main/bridge/screen-helper.ps1",
              "sha256": hashlib.sha256(hraw).hexdigest(),
              "mode": "local-only",
              "protections": ["sha256","syntax-parse","last-good-backup"]
          }
          Path('bridge/screen-helper-manifest.json').write_text(
              json.dumps(hmanifest, indent=2) + "\n",
              encoding='utf-8'
          )

      - name: Commit manifest
        shell: bash
        run: |
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "A newer bridge commit exists; skipping stale manifest publication."
            exit 0
          fi
          if git diff --quiet -- bridge/manifest-v2.json bridge/screen-helper-manifest.json; then
            echo "Manifest already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge/manifest-v2.json bridge/screen-helper-manifest.json
          git commit -m "bridge: publish validated manifest"
          git push
